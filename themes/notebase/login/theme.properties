# NoteBase login theme
# Built on Keycloak's unstyled "base" theme, so no PatternFly is loaded.
# Every class below is styled in resources/css/notebase.css.
parent=base
import=common/keycloak

locales=ka,en

styles=css/notebase.css
meta=viewport==width=device-width,initial-scale=1 theme-color==#f6f2ea

## Layout
kcHtmlClass=nb-html
kcBodyClass=nb
kcContentWrapperClass=nb-row

## Forms
kcFormClass=nb-form
kcFormGroupClass=nb-field
kcFormGroupErrorClass=nb-field--error
kcFormGroupHeader=nb-group-title
kcLabelClass=nb-label
kcLabelWrapperClass=nb-label-row
kcInputClass=nb-input
kcTextareaClass=nb-input
kcInputWrapperClass=nb-input-wrap
kcInputGroup=nb-input-group
kcInputLargeClass=
kcInputErrorMessageClass=nb-error
kcInputHelperTextBeforeClass=nb-help
kcInputHelperTextAfterClass=nb-help
kcInputClassRadio=nb-choice
kcInputClassRadioInput=nb-choice-input
kcInputClassRadioLabel=nb-choice-label
kcInputClassCheckbox=nb-choice
kcInputClassCheckboxInput=nb-choice-input
kcInputClassCheckboxLabel=nb-choice-label
kcInputClassRadioCheckboxLabelDisabled=nb-choice-label--disabled
kcCheckboxInputClass=nb-choice-input
kcCheckClass=nb-choice
kcCheckInputClass=nb-choice-input
kcCheckLabelClass=nb-choice-label
kcFormOptionsClass=nb-options
kcFormOptionsWrapperClass=nb-options-links
kcFormButtonsClass=nb-actions
kcFormSettingClass=nb-settings
kcSrOnlyClass=nb-sr-only

## Buttons
kcButtonClass=nb-btn
kcButtonPrimaryClass=nb-btn--primary
kcButtonDefaultClass=nb-btn--secondary
kcButtonBlockClass=nb-btn--block
kcButtonLargeClass=

## Password visibility toggle
kcFormPasswordVisibilityButtonClass=nb-reveal
kcFormPasswordVisibilityIconShow=nb-icon nb-icon--eye
kcFormPasswordVisibilityIconHide=nb-icon nb-icon--eye-off

## Alerts (template.ftl renders its own, these cover the other base pages)
kcAlertClass=nb-alert
kcAlertTitleClass=nb-alert-text
kcFeedbackErrorIcon=nb-hidden
kcFeedbackWarningIcon=nb-hidden
kcFeedbackSuccessIcon=nb-hidden
kcFeedbackInfoIcon=nb-hidden
kcResetFlowIcon=nb-hidden

## Info area under the form
kcSignUpClass=nb-info
kcInfoAreaWrapperClass=
kcInfoAreaClass=nb-info

## Identity providers
kcFormSocialAccountSectionClass=nb-social
kcFormSocialAccountListClass=nb-social-list
kcFormSocialAccountListGridClass=nb-social-list--grid
kcFormSocialAccountListButtonClass=nb-btn nb-btn--secondary nb-btn--block
kcFormSocialAccountListButtonDisabledClass=nb-btn--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=nb-social-name
kcCommonLogoIdP=nb-idp-icon

## Authenticator selection / OTP
kcSelectAuthListClass=nb-auth-list
kcSelectAuthListItemClass=nb-auth-item
kcSelectAuthListItemIconClass=nb-hidden
kcSelectAuthListItemIconPropertyClass=nb-hidden
kcSelectAuthListItemBodyClass=nb-auth-body
kcSelectAuthListItemHeadingClass=nb-auth-title
kcSelectAuthListItemDescriptionClass=nb-auth-desc
kcSelectAuthListItemFillClass=nb-auth-fill
kcSelectAuthListItemArrowClass=nb-auth-arrow
kcSelectAuthListItemArrowIconClass=nb-hidden
kcSelectAuthListItemTitle=nb-auth-title
kcLoginOTPListClass=nb-otp-list
kcLoginOTPListInputClass=nb-otp-input
kcLoginOTPListItemHeaderClass=nb-otp-head
kcLoginOTPListItemIconBodyClass=nb-hidden
kcLoginOTPListItemIconClass=nb-hidden
kcLoginOTPListItemTitleClass=nb-otp-title

## Recovery codes
kcRecoveryCodesWarning=nb-alert alert-warning
kcRecoveryCodesList=nb-codes
kcRecoveryCodesActions=nb-actions
kcRecoveryCodesConfirmation=nb-choice
